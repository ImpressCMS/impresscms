imports:
    # ImpressCMS services: their classes must not be loaded while the container
    # is compiled (library files exit without ICMS_ROOT_PATH), so no autowiring
    # or autoconfiguration there
    - { resource: services/icms.yaml }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Runtime/'
            - '../src/LegacyBridge/LegacyResolution.php'
            - '../src/LegacyBridge/LegacyExecutionResponse.php'
            - '../src/LegacyBridge/PreparedLegacyExecution.php'
            - '../src/Legacy/Attribute/'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\LegacyBridge\LegacyScriptResolver:
        arguments:
            $legacyRoot: '%icms.legacy.root%'
            $frontController: '%icms.legacy.front_controller%'
            $assetExtensions: '%icms.legacy.asset_extensions%'
            $nonPublicPaths: '%icms.legacy.non_public_paths%'
            $scriptFreePaths: '%icms.legacy.script_free_paths%'

    # fetched by App\Runtime\HostRunner
    App\LegacyBridge\LegacyBridge:
        public: true
        arguments:
            $mimeTypes: '%icms.legacy.mime_types%'
            $debug: '%kernel.debug%'

    App\Routing\ReservedPrefixLoader:
        arguments:
            $prefixes: '%icms.legacy.reserved_prefixes%'
            $env: '%kernel.environment%'
        tags: ['routing.loader']

    App\Legacy\LegacyRuntime:
        arguments:
            $mainfile: '%icms.legacy.root%/mainfile.php'

