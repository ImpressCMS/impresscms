services:
    _defaults:
        autowire: false
        autoconfigure: false

    # -- ImpressCMS services in the container (design D8) ----------------------
    # Each returns the instance legacy code sees as icms::$<name>, booting
    # legacy up to the stage that creates it.
    icms.db:
        class: Icms\Db\IConnection
        public: true
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['db']
    icms.db.legacy:
        class: Icms\Db\Legacy\PdoDatabase
        public: true
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['xoopsDB']
    icms.config:
        class: Icms\Config\Handler
        public: true
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['config']
    icms.security:
        class: Icms\Core\Security
        public: true
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['security']
    icms.logger:
        class: Icms\Core\Logger
        public: true
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['logger']
    icms.session:
        class: Icms\Core\Session
        public: true
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['session']
    icms.preload:
        class: Icms\Preload\Handler
        public: true
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['preload']
    # the current user and module may be null (anonymous visitor, no module):
    # no autowiring aliases, fetch them from the container or LegacyRuntime
    icms.user:
        class: Icms\Member\User\Entity
        public: true
        shared: false
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['user']
    icms.module:
        class: Icms\Module\Entity
        public: true
        shared: false
        factory: ['@App\Legacy\LegacyRuntime', 'service']
        arguments: ['module']

    Icms\Db\IConnection: '@icms.db'
    Icms\Db\Legacy\PdoDatabase: '@icms.db.legacy'
    Icms\Config\Handler: '@icms.config'
    Icms\Core\Security: '@icms.security'
    Icms\Core\Logger: '@icms.logger'
    Icms\Core\Session: '@icms.session'
    Icms\Preload\Handler: '@icms.preload'

    icms.handlers:
        class: App\Legacy\HandlerLocator
        public: true
        arguments:
            $runtime: '@App\Legacy\LegacyRuntime'
            $aliasMap: '%icms.legacy.root%/libraries/Icms/aliases.php'
    App\Legacy\HandlerLocator: '@icms.handlers'
