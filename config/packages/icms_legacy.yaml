# Legacy ImpressCMS behind the Symfony host (legacy-request-bridge).
parameters:
    # the web root: passed by its index.php as ICMS_LEGACY_ROOT, named in
    # .env.local for bin/console; htdocs/ in a development checkout
    icms.legacy.default_root: '%kernel.project_dir%/htdocs'
    icms.legacy.root: '%env(default:icms.legacy.default_root:ICMS_LEGACY_ROOT)%'
    # executed for legacy-owned paths that do not exist
    icms.legacy.front_controller: 'index.php'
    # path prefixes that belong to Symfony and never fall through to legacy,
    # for example ['admin-next']; none by default
    icms.legacy.reserved_prefixes: []
    # directories never served or executed (relative to the legacy root, or
    # absolute): the same as in docs/server/ and htdocs/htaccess.txt, and the
    # trust path, which the web root's index.php passes as ICMS_TRUST_PATH, if
    # it is under the root
    icms.legacy.non_public_paths:
        - 'templates_c'
        - 'cache'
        - 'trust_dist'
        - 'tests'
        - 'plugins/waiting'
        - 'libraries/tcpdf/tools'
        - 'install/modules/protector/trust_path'
        - '%env(default::ICMS_TRUST_PATH)%'
    # directories whose PHP files are never executed
    icms.legacy.script_free_paths:
        - 'uploads'
    # static files served directly, with explicit types for web assets
    icms.legacy.asset_extensions: [avif, bmp, css, csv, eot, gif, htm, html, ico, jpeg, jpg, js, json, map, mjs, mp3, mp4, otf, pdf, png, svg, swf, ttf, txt, webm, webp, woff, woff2, xml, xsl, zip]
    icms.legacy.mime_types:
        avif: 'image/avif'
        bmp: 'image/bmp'
        css: 'text/css; charset=UTF-8'
        csv: 'text/csv; charset=UTF-8'
        gif: 'image/gif'
        htm: 'text/html; charset=UTF-8'
        html: 'text/html; charset=UTF-8'
        ico: 'image/x-icon'
        jpeg: 'image/jpeg'
        jpg: 'image/jpeg'
        js: 'application/javascript'
        json: 'application/json'
        map: 'application/json'
        mjs: 'application/javascript'
        otf: 'font/otf'
        png: 'image/png'
        svg: 'image/svg+xml'
        ttf: 'font/ttf'
        txt: 'text/plain; charset=UTF-8'
        webm: 'video/webm'
        webp: 'image/webp'
        woff: 'font/woff'
        woff2: 'font/woff2'
        xml: 'application/xml'

when@test:
    parameters:
        icms.legacy.reserved_prefixes: ['admin-next']
