# ImpressCMS on Apache 2.4 with PHP-FPM (docs/symfony-host.md).
#
# Adjust ServerName, the web root (the contents of htdocs/) and the PHP-FPM
# socket. The rewrite rules (routing levels 2 and 3, never-served paths) are in
# htdocs/htaccess.txt: rename it to .htaccess, or set AllowOverride None and
# paste its <IfModule mod_rewrite.c> block into the <Directory> section below.
# Needs mod_rewrite, mod_proxy and mod_proxy_fcgi.

<VirtualHost *:80>
    ServerName example.test
    DocumentRoot /var/www/impresscms

    <Directory /var/www/impresscms>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>
