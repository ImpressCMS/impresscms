name: Tests

on:
  push:
    branches: [main, '2.*', 'pre-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  ICMS_TEST_DB_HOST: 127.0.0.1
  ICMS_TEST_DB_PORT: 3306
  ICMS_TEST_DB_USER: root
  ICMS_TEST_DB_PASS: root
  ICMS_TEST_DB_NAME: icms_test

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, json, mbstring, mysqli, pdo_mysql, xml, zlib
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: |
          find src tests config htdocs/libraries/Icms htdocs/include htdocs/install docs/server -name '*.php' -print0 \
            | xargs -0 -r -n 50 -P 4 php -l > /dev/null
          for script in bin/* host.php htdocs/index.php htdocs/mainfile.php; do php -l "$script" > /dev/null; done

      - name: Library suite
        run: vendor/bin/phpunit --testsuite Library

      - name: Unit suite
        run: vendor/bin/phpunit --testsuite Unit

      - name: Test site
        run: php bin/test-db

      - name: Integration suite
        run: vendor/bin/phpunit --testsuite Integration

      - name: Functional suite
        run: vendor/bin/phpunit --testsuite Functional

      - name: Http suite (routing level 3, every request through the host)
        run: vendor/bin/phpunit --testsuite Http
        env:
          ICMS_TEST_ROUTING: 3

      - name: Http suite (routing level 2, scripts executed directly)
        run: vendor/bin/phpunit --testsuite Http
        env:
          ICMS_TEST_ROUTING: 2

      - name: Upgrade from a site without the host (bin/build-dist)
        run: |
          php bin/build-dist
          vendor/bin/phpunit tests/Http/HostUpgradeTest.php
          test ! -e htdocs/trust_dist

      - name: Spec coverage
        run: php bin/spec-coverage

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # keeps the host ready for the next Symfony LTS (design D1)
      - name: No deprecations triggered by src/
        run: vendor/bin/phpunit --testsuite Unit,Integration,Functional --fail-on-deprecation --display-deprecations

  webservers:
    name: ${{ matrix.server }}, routing level ${{ matrix.level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [apache, nginx, frankenphp]
        level: [2, 3]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, json, mbstring, mysqli, pdo_mysql, xml, zlib
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test site
        run: php bin/test-db

      - name: Start ${{ matrix.server }} with docs/server/
        run: bash .github/scripts/webserver.sh ${{ matrix.server }} ${{ matrix.level }}

      - name: Http suite against ${{ matrix.server }}
        run: vendor/bin/phpunit --testsuite Http
        env:
          ICMS_TEST_BASE_URL: http://127.0.0.1:8080
          ICMS_TEST_ROUTING: ${{ matrix.level }}

      - name: Server logs
        if: failure()
        run: |
          sudo tail -n 100 /var/log/nginx/error.log /var/log/apache2/error.log 2>/dev/null || true
          tail -n 100 var/log/test.log 2>/dev/null || true

  old-php:
    name: Requirements page on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.1']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Release package (bin/build-package)
        run: |
          php bin/build-package --output=var/dist/package.zip
          mkdir -p var/site
          unzip -q var/dist/package.zip -d var/site

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Every entry point answers with the requirements page
        run: |
          php -S 127.0.0.1:8090 -t var/site > var/php-server.log 2>&1 &
          sleep 2
          expect_page() {
            local body status
            body=$(curl -s -w '\n%{http_code}' "http://127.0.0.1:8090$1")
            status=${body##*$'\n'}
            if [ "$status" != 503 ] || ! grep -q "PHP $(php -r 'echo PHP_VERSION;')" <<<"$body" || ! grep -q 'PHP 8.2.0 or newer' <<<"$body"; then
              echo "::error::$1 answered $status without the requirements page"
              echo "$body" | head -20
              return 1
            fi
            echo "$1: 503 with the requirements page"
          }
          failed=0
          # not installed: the home page and the installer
          for path in / /index.php /install/ /install/page_start.php; do expect_page "$path" || failed=1; done
          # installed: legacy scripts through mainfile.php and include/common.php
          mkdir -p var/trust
          printf '%s\n' '<?php' "define('XOOPS_ROOT_PATH', '$PWD/var/site');" "define('ICMS_ROOT_PATH', XOOPS_ROOT_PATH);" \
            "define('XOOPS_TRUST_PATH', '$PWD/var/trust');" "define('XOOPS_MAINFILE_INCLUDED', 1);" \
            "if (!isset(\$xoopsOption['nocommon'])) { include ICMS_ROOT_PATH . '/include/common.php'; }" > var/site/mainfile.php
          for path in / /user.php /modules/system/admin.php; do expect_page "$path" || failed=1; done
          [ "$failed" = 0 ] || { cat var/php-server.log; exit 1; }
